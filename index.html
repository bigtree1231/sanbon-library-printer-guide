<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>산본도서관 프린터 이용 가이드</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #f4f4f4; /* 배경색 */
            /* 스크롤을 허용하기 위해 overflow: hidden 제거 */
        }
        .guide-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .guide-image {
            width: 100%; /* 화면 너비에 꽉 채움 */
            height: auto; /* 비율에 맞춰 높이 자동 조절 */
            display: block;
        }
    </style>
</head>
<body>
    <div class="guide-container">
        <img src="my-guide.jpg" alt="프린터 이용 가이드" class="guide-image">
    </div>
</body>
</html>
